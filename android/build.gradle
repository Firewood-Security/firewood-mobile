allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    plugins.withId('com.android.library') {
        android {
            compileSdkVersion 35
            buildToolsVersion "35.0.0"
            if (project.name == "flutter_nearby_connections_plus") {
                namespace = "com.nankai.flutter_nearby_connections"
            } else if (project.name == "flutter_bluetooth_serial") {
                namespace = "io.github.edufolly.flutterbluetoothserial"
            } else if (namespace == null) {
                namespace = "dev.isar.${project.name.replace('-', '_')}"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
    plugins.withId('com.android.application') {
        android {
            compileSdkVersion 35
            buildToolsVersion "35.0.0"
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    tasks.configureEach { task ->
        if (task.name.toLowerCase().contains("kotlincompile") || task.name.toLowerCase().contains("compiledebugkotlin") || task.name.toLowerCase().contains("compilereleasekotlin")) {
            try {
                task.kotlinOptions.jvmTarget = "17"
            } catch (Exception ignored) {}
        }
    }
}

subprojects {
    tasks.whenTaskAdded { task ->
        if (task.name.toLowerCase().contains("verifylibraryresources") || task.name.toLowerCase().contains("verifyreleaseresources")) {
            task.enabled = false
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
