name: Firewood Mobile CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format check (blocking)
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis (blocking)
        run: flutter analyze --no-fatal-infos
      - name: Secret scan (blocking, lightweight)
        run: |
          set -e
          if git grep -n -E "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|storePassword\s*=\s*\S|keyPassword\s*=\s*\S" \
              -- ':(exclude)android/key.properties.template' ':(exclude)**/*.md' . ; then
            echo "Potential secret material committed"; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Unit & widget tests (blocking)
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: firewood-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
