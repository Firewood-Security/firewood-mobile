name: Deploy Website to Firebase Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Website Dependencies
        run: npm install
        working-directory: web

      - name: Build Static Website
        run: npm run build
        working-directory: web

      - name: Check Firebase Service Account Secret
        id: check_secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIREWOOD }}" ]; then
            echo "SECRET_PRESENT=false" >> $GITHUB_OUTPUT
            echo "::warning ::FIREBASE_SERVICE_ACCOUNT_FIREWOOD secret is missing in GitHub Secrets. Skipping automated Firebase deployment."
          else
            echo "SECRET_PRESENT=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Firebase Hosting
        if: steps.check_secret.outputs.SECRET_PRESENT == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIREWOOD }}
          channelId: live
          projectId: firewood-web
