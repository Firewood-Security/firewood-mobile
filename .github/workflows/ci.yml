name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flutter-check:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test

  tauri-check:
    name: Tauri Desktop Check & Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libdbus-1-dev \
            udev \
            libudev-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: tauri-app

      - name: Check Frontend Build (Vite)
        run: npm run build
        working-directory: tauri-app

      - name: Check Rust Formatting
        run: cargo fmt --all --check
        working-directory: tauri-app/src-tauri

      - name: Run Cargo Clippy
        run: cargo clippy
        working-directory: tauri-app/src-tauri

      - name: Run Rust Unit Tests
        run: cargo test
        working-directory: tauri-app/src-tauri

  website-check:
    name: Product Website Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Website Dependencies
        run: npm ci
        working-directory: web

      - name: Build Website
        run: npm run build
        working-directory: web
