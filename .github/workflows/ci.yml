name: CI & Main Branch Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  flutter-build:
    name: Flutter Android Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firewood-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  tauri-build:
    name: Tauri Desktop Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os-name: linux
          - platform: windows-latest
            os-name: windows

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libdbus-1-dev \
            udev \
            libudev-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: tauri-app

      - name: Check Rust Formatting
        run: cargo fmt --all --check
        working-directory: tauri-app/src-tauri

      - name: Run Cargo Clippy
        run: cargo clippy
        working-directory: tauri-app/src-tauri

      - name: Run Rust Unit Tests
        run: cargo test
        working-directory: tauri-app/src-tauri

      - name: Configure OS-Specific Bundle Targets
        shell: bash
        run: |
          OS_NAME="${{ matrix.os-name }}"
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("tauri-app/src-tauri/tauri.conf.json"));
            if ("'"${OS_NAME}"'" === "linux") {
              conf.bundle.targets = ["deb", "appimage"];
            } else if ("'"${OS_NAME}"'" === "windows") {
              conf.bundle.targets = ["nsis"];
            }
            fs.writeFileSync("tauri-app/src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2));
          '

      - name: Build Tauri Desktop Binary
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./tauri-app
          tagName: main-build-${{ github.sha }}
          releaseName: 'Firewood Dev Build'
          releaseDraft: true
          prerelease: true

  website-check:
    name: Product Website Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Website Dependencies
        run: npm install
        working-directory: web

      - name: Build Website
        run: npm run build
        working-directory: web
